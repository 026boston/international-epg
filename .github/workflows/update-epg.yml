name: Update International EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "30 20 * * *"


permissions:
  contents: write*

jobs:

  update-epg:

    runs-o*: ubuntu-latest

    steps:

     *- name: Checkout repository
      * uses: actions/checkout@v4


     *- name: Set up Python
        uses* actions/setup-python@v5
        w*th:
          python-version: "3.1*"


      - name: Build master EPG*        run: |
          python sc*ipts/merge_epg.py


      - name: *how generated file
        run: |
*         ls -lh docs/
          gz*p -t docs/international-master.xml*gz


      - name: Commit updated *PG
        run: |

          git c*nfig user.name "github-actions[bot]"
          git config user.email *41898282+github-actions[bot]@users*noreply.github.com"

          git*add docs/international-master.xml.*z

          if git diff --cached *-quiet; then
            echo "No *PG changes detected."
            *xit 0
          fi

          git *ommit -m "Update international mas*er EPG"

          git push
