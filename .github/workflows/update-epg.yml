name: Update International EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build master EPG
        run: python scripts/merge_epg.py

      - name: Validate generated EPG
        run: |
          ls -lh docs/
          gzip -t docs/international-master.xml.gz

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/international-master.xml.gz

          if git diff --cached --quiet; then
            echo "No EPG changes detected."
            exit 0
          fi

          git commit -m "Update international master EPG"
          git push
